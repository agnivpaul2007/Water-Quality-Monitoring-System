<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaSense | Real-Time Water Quality Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">💧</div>
        <div>
          <h1>AquaSense</h1>
          <p>Web Serial • Direct Arduino Connection</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="live-badge" id="connectionBadge">
          <span class="live-dot"></span>
          <span id="connectionText">NOT CONNECTED</span>
        </div>
        <div class="timestamp" id="lastUpdate">Click “Connect Arduino”</div>
        <div class="controls">
          <button id="btnConnect" class="primary">Connect Arduino</button>
          <button id="btnDisconnect" disabled>Disconnect</button>
          <button id="btnPause">Pause</button>
          <button id="btnReset">Reset</button>
        </div>
      </div>
    </header>

    <section class="kpi-grid" id="kpiGrid"></section>

    <div class="main-grid">
      <div>
        <div class="panel">
          <div class="panel-title">
            <span id="chartTitle">pH Level Trend</span>
            <span>Last 30 samples</span>
          </div>
          <div class="sensor-switcher">
            <button class="sensor-btn active" data-sensor="pH">pH</button>
            <button class="sensor-btn" data-sensor="temperature">Temperature</button>
            <button class="sensor-btn" data-sensor="tds">TDS</button>
            <button class="sensor-btn" data-sensor="turbidity">Turbidity</button>
          </div>
          <div class="chart-container">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
        <div class="gauges" id="gaugeSection"></div>
      </div>

      <div class="side-stack">
        <div class="panel">
          <div class="panel-title">Recent Alerts <span id="alertCount">0</span></div>
          <div class="alerts-list" id="alertsList">
            <div class="alert-item" style="border-left-color:var(--good)">
              <div>
                <strong>Ready</strong>
                <div class="time">Click “Connect Arduino” and select the COM port</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div>AquaSense • Direct Web Serial (no backend)</div>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--good)"></span>Good</span>
        <span><span class="legend-dot" style="background:var(--warning)"></span>Warning</span>
        <span><span class="legend-dot" style="background:var(--critical)"></span>Critical</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
